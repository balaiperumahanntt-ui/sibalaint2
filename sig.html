<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIG Terpadu - Balai P3KP NTT</title>
  <link rel="icon" type="image/x-icon" href="https://i.ibb.co.com/RpTQRCrn/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { krem: '#F2EEDF', khaki: '#D5C58A', darkaqua: '#0E5B73', midnightgreen: '#084C61', brand: { teal: '#0E5975', darkteal: '#093C4F', gold: '#CBA355' } } } }
    }
  </script>
  <style>
    .custom-map-label { pointer-events: none; transition: opacity 0.3s ease-in-out; }
    .btn-select { transition: all 0.3s ease; }
    .btn-select.active { background-color: #0E5975; color: white; border-color: #0E5975; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(14, 89, 117, 0.3); }
    .btn-select:not(.active) { background-color: white; color: #475569; border-color: #CBD5E1; }
  </style>
</head>
<body class="bg-[#F3F5F7] min-h-screen text-slate-800 pb-12 antialiased">

 <!-- HEADER -->
    <header class="bg-midnightgreen/95 backdrop-blur-md border-b-4 border-khaki text-krem sticky top-0 z-50 transition-all shadow-md mb-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-3">
                <div class="flex items-center gap-5">
                    <a href="#" class="flex items-center shrink-0">
                        <img src="https://i.ibb.co.com/Gf4rz3Yn/BALAI-NT-II-8.png" alt="Maskot SiBalai" class="w-[180px] h-auto object-contain">
                    </a>
                    <a href="index.html" class="text-krem/80 hover:text-khaki transition-all text-sm font-medium flex items-center gap-1 px-2 py-1.5 rounded-lg hover:bg-krem/10 border border-transparent hover:border-krem/20 mt-2.5">
                        <i class="fa-solid fa-arrow-left"></i> Kembali
                    </a>
                </div>
                <div class="hidden md:flex space-x-1 font-medium">
                    <span class="px-4 py-3 bg-darkaqua/50 rounded-lg text-krem"><i class="fa-solid fa-location-dot mr-2"></i> Portal Sistem Informasi Geografis</span>
                </div>
            </div>
        </div>
    </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 mt-8">
    <div class="text-center mb-8" data-aos="fade-up">
       <span class="inline-block px-3 py-1 bg-brand-gold/20 text-brand-gold border border-brand-gold/40 rounded-full text-xs font-semibold tracking-wider uppercase mb-2">Kementerian Perumahan & Kawasan Permukiman</span>
       <h1 class="text-2xl md:text-3xl font-extrabold text-brand-darkteal tracking-tight">Sistem Informasi Geografis Terpadu</h1>
    </div>

    <div class="flex flex-wrap justify-center gap-3 md:gap-6 mb-8" data-aos="fade-up" data-aos-delay="100">
        <button onclick="changeMode('rtlh')" id="btn-rtlh" class="btn-select px-6 py-3 rounded-xl border-2 font-bold flex items-center gap-2 shadow-sm"><i class="fa-solid fa-house-chimney-crack"></i> Sebaran RTLH</button>
        <button onclick="changeMode('rusun')" id="btn-rusun" class="btn-select px-6 py-3 rounded-xl border-2 font-bold flex items-center gap-2 shadow-sm"><i class="fa-solid fa-building"></i> Sebaran Rusun</button>
        <button onclick="changeMode('bsps')" id="btn-bsps" class="btn-select px-6 py-3 rounded-xl border-2 font-bold flex items-center gap-2 shadow-sm"><i class="fa-solid fa-hammer"></i> Sebaran Bedah Rumah</button>
        <button onclick="changeMode('rusus')" id="btn-rusus" class="btn-select px-6 py-3 rounded-xl border-2 font-bold flex items-center gap-2 shadow-sm"><i class="fa-solid fa-house-flag"></i> Sebaran Rusus</button>
    </div>

    <!-- FILTER KHUSUS BSPS TAHUN & KABUPATEN -->
    <div id="bsps-filter-container" class="hidden bg-white p-4 rounded-2xl shadow-md border border-slate-200 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-4 w-full sm:w-auto">
            <span class="w-10 h-10 rounded-xl bg-brand-gold/20 text-brand-gold font-bold flex items-center justify-center shrink-0"><i class="fa-solid fa-filter"></i></span>
            <div class="flex flex-col sm:flex-row gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide">Tahun Anggaran</label>
                    <select id="bspsYearSelect" onchange="handleBspsYearChange()" class="mt-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-brand-darkteal focus:outline-none focus:border-brand-teal"></select>
                </div>
                <div id="kabSelectWrapper" class="hidden">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide">Fokus Kabupaten</label>
                    <select id="bspsKabSelect" onchange="renderBSPS()" class="mt-1 bg-slate-50 border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold text-brand-darkteal focus:outline-none focus:border-brand-teal"></select>
                </div>
            </div>
        </div>
    </div>

    <section data-aos="fade-up" data-aos-delay="200" class="mb-10 bg-white p-3 rounded-3xl shadow-xl border border-slate-100 relative z-10">
        <div id="map" class="w-full h-[500px] rounded-2xl bg-slate-50 shadow-inner"></div>
    </section>

    <div id="dashboard-wrapper" class="hidden space-y-10">
        <div id="main-content">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10" id="stats-container"></div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6">
                    <div class="flex items-center gap-3 border-b-2 border-brand-gold/30 pb-3 mb-4">
                        <span class="w-8 h-8 rounded-xl bg-brand-teal text-white font-bold text-sm flex items-center justify-center shadow">📊</span>
                        <h2 id="chart-title" class="text-lg font-bold text-brand-darkteal uppercase tracking-wide">Grafik Data</h2>
                    </div>
                    <div class="w-full relative h-[350px]"><canvas id="barChart"></canvas></div>
                </div>
                <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 flex flex-col">
                    <div class="flex items-center justify-between border-b-2 border-brand-gold/30 pb-3 mb-4">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-xl bg-brand-teal text-white font-bold text-sm flex items-center justify-center shadow">📑</span>
                            <h2 class="text-lg font-bold text-brand-darkteal uppercase tracking-wide">Rincian Data</h2>
                        </div>
                    </div>
                    <div class="overflow-y-auto flex-1 rounded-xl border border-slate-200 shadow-sm" style="max-height: 350px;">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="sticky top-0 bg-brand-darkteal text-white uppercase tracking-wide z-10" id="table-head"></thead>
                            <tbody id="table-body" class="divide-y divide-slate-200 bg-white text-slate-700"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </main>

  <div id="loadingModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[9999] flex flex-col items-center justify-center text-white p-4">
    <div class="w-16 h-16 border-4 border-brand-gold border-t-transparent rounded-full animate-spin mb-4"></div>
    <h3 class="text-lg font-bold text-white">Memuat Sistem Informasi...</h3>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz7BYd76WrArwoH4UYNhfVM1QScJZ8kRmt-BViScgvae6aGNVOwEotzQvynWN6ZqQkXsQ/exec";

    let allData = { rtlh: [], rusun: [], bsps_old: [], bsps_new: [], rusus: [] };
    let sheetDataMap = {}; 
    let bspsPolygonMap = {};
    let rususMap = {};
    let myChart = null, map = null;
    
    let geojsonFillLayer = null, geojsonBorderLayer = null;
    let labelLayerGroup = L.layerGroup(), pointLayerGroup = L.layerGroup();
    
    let legendRTLH, legendBSPS_Polygon, legendBSPS_Point, legendRusus;
    let activeLegend = null;
    let currentMode = null;
    let currentBspsFormat = 'polygon';

    document.addEventListener("DOMContentLoaded", function() {
      AOS.init({ duration: 800, once: true });
      initMap();
      fetchData(true);
    });

    function initMap() {
      const nttBounds = [[-11.5, 117.5], [-7.5, 126.0]];
      map = L.map('map', { minZoom: 7, maxBounds: nttBounds, maxBoundsViscosity: 1.0 }).setView([-8.65, 121.0], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      map.createPane('paneFillKabupaten'); map.getPane('paneFillKabupaten').style.zIndex = 390;
      map.createPane('paneBorderKabupaten'); map.getPane('paneBorderKabupaten').style.zIndex = 480;
      
      labelLayerGroup.addTo(map); pointLayerGroup.addTo(map);

      fetch('https://raw.githubusercontent.com/balaiperumahanntt-ui/petanttgeojson/main/ntt%20geojson.geojson')
        .then(res => res.json())
        .then(data => {
          geojsonFillLayer = L.geoJson(data, { pane: 'paneFillKabupaten', style: {fillOpacity: 0, weight: 0}, onEachFeature: onEachFeature }).addTo(map);
          geojsonBorderLayer = L.geoJson(data, { pane: 'paneBorderKabupaten', style: () => ({ fill: false, weight: 2, color: '#1e293b', opacity: 0.9 }), interactive: false }).addTo(map);
        });

      legendRTLH = L.control({position: 'bottomright'});
      legendRTLH.onAdd = function () {
        let div = L.DomUtil.create('div', 'bg-white/90 p-3 rounded-xl shadow-lg border border-slate-200');
        div.innerHTML = `<div style="font-weight: 700; font-size: 12px; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px;">Sebaran RTLH</div>
          <table style="font-size: 11px;">
            <tr><td><i style="background: #fee5d9; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> 0 - 2.5K</td></tr>
            <tr><td><i style="background: #a50f15; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> > 20K</td></tr>
          </table>`; return div;
      };

      legendBSPS_Polygon = L.control({position: 'bottomright'});
      legendBSPS_Polygon.onAdd = function () {
        let div = L.DomUtil.create('div', 'bg-white/90 p-3 rounded-xl shadow-lg border border-slate-200');
        div.innerHTML = `<div style="font-weight: 700; font-size: 12px; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px;">Alokasi BSPS</div>
          <table style="font-size: 11px;"><tr><td><i style="background: #0E5975; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> Ada Alokasi</td></tr></table>`; return div;
      };

      legendBSPS_Point = L.control({position: 'bottomright'});
      legendBSPS_Point.onAdd = function () {
        let div = L.DomUtil.create('div', 'bg-white/90 p-3 rounded-xl shadow-lg border border-slate-200');
        div.innerHTML = `<div style="font-weight: 700; font-size: 12px; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px;">Progres Bedah Rumah Koordinat</div>
          <table style="font-size: 11px;">
            <tr><td><i style="background: #22c55e; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> 100% Selesai</td></tr>
            <tr><td><i style="background: #eab308; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> 30% - <100%</td></tr>
            <tr><td><i style="background: #f97316; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> >0% - 30%</td></tr>
            <tr><td><i style="background: #ef4444; border-radius:50%; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> 0%</td></tr>
          </table>`; return div;
      };

      legendRusus = L.control({position: 'bottomright'});
      legendRusus.onAdd = function () {
        let div = L.DomUtil.create('div', 'bg-white/90 p-3 rounded-xl shadow-lg border border-slate-200');
        div.innerHTML = `<div style="font-weight: 700; font-size: 12px; margin-bottom: 6px; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px;">Alokasi Rusus</div>
          <table style="font-size: 11px;"><tr><td><i style="background: #0E5975; width:12px; height:12px; display:inline-block; margin-right:4px;"></i> Ada Alokasi</td></tr></table>`; return div;
      };
    }

    function normalizeName(name) { return String(name || "").toUpperCase().replace(/KABUPATEN/g, '').replace(/KAB\./g, '').trim(); }

    function styleFillFeature(feature) {
      if(!currentMode || currentMode === 'rusun') return { fillOpacity: 0, weight: 0 };
      let kabFormat = normalizeName(feature.properties.nama_daerah || feature.properties.NAMOBJ);
      
      if(currentMode === 'rtlh') {
        let d = sheetDataMap[kabFormat] || { rtlh: 0 };
        let color = d.rtlh > 20000 ? '#a50f15' : d.rtlh > 10000 ? '#de2d26' : d.rtlh > 5000 ? '#fb6a4a' : d.rtlh > 2500 ? '#fcae91' : '#fee5d9';
        return { fillColor: color, weight: 0, fillOpacity: 0.8 };
      } else if(currentMode === 'bsps') {
        let isPoint = (currentBspsFormat === 'point');
        let units = bspsPolygonMap[kabFormat] || 0;
        return { fillColor: '#0E5975', weight: 0, fillOpacity: units > 0 ? (isPoint ? 0.05 : 0.8) : 0 };
      } else if(currentMode === 'rusus') {
        return { fillColor: '#0E5975', weight: 0, fillOpacity: (rususMap[kabFormat] || 0) > 0 ? 0.8 : 0 };
      }
      return { fillOpacity: 0, weight: 0 };
    }

    function onEachFeature(feature, layer) {
      let namaKab = feature.properties.nama_daerah || feature.properties.NAMOBJ;
      let keyFormat = normalizeName(namaKab);

      if (layer.getBounds) {
        let label = L.marker(layer.getBounds().getCenter(), {
          icon: L.divIcon({ className: 'custom-map-label', html: `<div style="font-size: 9px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000; text-align: center; text-transform: uppercase;">${namaKab}</div>`, iconSize: [90, 18], iconAnchor: [45, 9]}),
          interactive: false
        });
        labelLayerGroup.addLayer(label);
        layer.labelMarker = label;
      }

      layer.on({
        mouseover: (e) => { if(currentMode && currentMode !== 'rusun' && currentBspsFormat !== 'point') e.target.setStyle({ fillColor: '#CBA355', fillOpacity: 0.6 }); },
        mouseout: (e) => { if(currentMode && currentMode !== 'rusun') e.target.setStyle(styleFillFeature(e.target.feature)); },
        click: (e) => {
          if(currentMode === 'rtlh') {
            let d = sheetDataMap[keyFormat] || { rtlh: 0, backlog: 0 };
            layer.bindPopup(`<b>${namaKab}</b><br>RTLH: ${d.rtlh} | Backlog: ${d.backlog}`).openPopup();
          } else if(currentMode === 'bsps' && currentBspsFormat === 'polygon') {
            layer.bindPopup(`<b>${namaKab}</b><br>Total BSPS: ${bspsPolygonMap[keyFormat] || 0} Unit`).openPopup();
          }
        }
      });
    }

    function fetchData(showLoading) {
      if(showLoading) document.getElementById('loadingModal').classList.remove('hidden');
      fetch(API_URL).then(res => res.json()).then(data => {
          allData = data; 
          processDataMaps();
          document.getElementById('loadingModal').classList.add('hidden');
          if(currentMode) changeMode(currentMode);
      }).catch(err => alert("Gagal memuat data dari Spreadsheet."));
    }

    function processDataMaps() {
      rususMap = {};
      allData.rusus.forEach(row => { let k=row[2], u=parseInt(row[3])||0; if(k) rususMap[normalizeName(k)] = (rususMap[normalizeName(k)]||0)+u; });
    }

    function changeMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn-select').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-'+mode).classList.add('active');
      document.getElementById('dashboard-wrapper').classList.remove('hidden');
      document.getElementById('bsps-filter-container').classList.add('hidden');
      
      pointLayerGroup.clearLayers();
      if(activeLegend) { map.removeControl(activeLegend); activeLegend = null; }
      map.closePopup();

      if(mode === 'rtlh') {
          renderRTLH(); activeLegend = legendRTLH.addTo(map);
          if(geojsonFillLayer) geojsonFillLayer.setStyle(styleFillFeature);
      } else if(mode === 'rusun') {
          renderRusun();
      } else if(mode === 'rusus') {
          renderRusus(); activeLegend = legendRusus.addTo(map);
          if(geojsonFillLayer) geojsonFillLayer.setStyle(styleFillFeature);
      } else if(mode === 'bsps') {
          document.getElementById('bsps-filter-container').classList.remove('hidden');
          initBspsDropdown();
      }
    }

    function initBspsDropdown() {
      let yearSet = new Set();
      allData.bsps_old.forEach(r => { if(r[4]) yearSet.add(String(r[4]).trim()); }); 
      allData.bsps_new.forEach(r => { if(r[5]) yearSet.add(String(r[5]).trim()); }); // Indeks 5 untuk TA pada format baru
      
      let years = Array.from(yearSet).sort().reverse();
      let sel = document.getElementById('bspsYearSelect');
      sel.innerHTML = '';
      years.forEach(y => sel.innerHTML += `<option value="${y}">Tahun ${y}</option>`);
      
      handleBspsYearChange();
    }

    function handleBspsYearChange() {
      let selectedYear = document.getElementById('bspsYearSelect').value;
      let isNewFormat = allData.bsps_new.some(r => String(r[5]).trim() === selectedYear);

      if (activeLegend) map.removeControl(activeLegend);

      if (isNewFormat) {
          currentBspsFormat = 'point';
          activeLegend = legendBSPS_Point.addTo(map);
          document.getElementById('kabSelectWrapper').classList.remove('hidden');
          
          let kabSet = new Set();
          allData.bsps_new.filter(r => String(r[5]).trim() === selectedYear).forEach(r => { if(r[2]) kabSet.add(String(r[2]).trim()); });
          let sel = document.getElementById('bspsKabSelect');
          sel.innerHTML = '<option value="ALL">-- Seluruh NTT --</option>';
          Array.from(kabSet).sort().forEach(k => sel.innerHTML += `<option value="${k}">${k}</option>`);
      } else {
          currentBspsFormat = 'polygon';
          activeLegend = legendBSPS_Polygon.addTo(map);
          document.getElementById('kabSelectWrapper').classList.add('hidden');
      }
      renderBSPS();
    }

   function renderBSPS() {
      let year = document.getElementById('bspsYearSelect').value;
      let tbody = '';
      let totalUnits = 0;
      let kabCounts = {};
      pointLayerGroup.clearLayers();
      bspsPolygonMap = {};

      if (currentBspsFormat === 'point') {
        let kabFilter = document.getElementById('bspsKabSelect').value;
        let dataToRender = allData.bsps_new.filter(r => String(r[5]).trim() === year);
        if (kabFilter !== "ALL") dataToRender = dataToRender.filter(r => String(r[2]).trim() === kabFilter);
        
        let bounds = L.latLngBounds();

        dataToRender.forEach((row, i) => {
          // Mapping Sesuai Urutan Kolom Baru Anda:
          // 0:NO BNBA, 1:NAMA, 2:KAB/KOTA, 3:KECAMATAN, 4:DESA/KELURAHAN, 5:TA, 6:KOORDINAT, 7:PROGRES, 8:TAHAPINVER, 9:FOTO
          let nobnba = row[0], nama = row[1], kab = row[2], kec = row[3], desa = row[4], ta = row[5];
          let koordinatStr = String(row[6] || "").trim();
          let progresRaw = String(row[7] || "").trim(); // Membaca teks progres dari spreadsheet
          let tahap = row[8], foto = row[9];

          if(kab) {
            totalUnits++;
            kabCounts[kab] = (kabCounts[kab] || 0) + 1;
            bspsPolygonMap[normalizeName(kab)] = 1;

            // Logika warna berdasarkan kategori teks di spreadsheet
            let color = '#ef4444'; // Merah (default / 0)
            if (progresRaw === '100') {
              color = '#22c55e'; // Hijau
            } else if (progresRaw === '30 - <100') {
              color = '#eab308'; // Kuning
            } else if (progresRaw === '30') {
              color = '#f97316'; // Oranye
            }

            let fotoBadge = foto ? `<a href="${foto}" target="_blank" class="text-brand-teal underline font-semibold"><i class="fa-solid fa-image"></i> Lihat</a>` : '-';

            tbody += `<tr class="hover:bg-slate-50">
              <td class="py-2 px-4 text-center">${i+1}</td>
              <td class="py-2 px-4 text-xs">${nobnba||'-'}</td>
              <td class="py-2 px-4 font-bold text-brand-darkteal">${nama||'-'}</td>
              <td class="py-2 px-4">${desa||'-'}</td>
              <td class="py-2 px-4 text-center"><span class="px-2 py-1 rounded text-white font-bold" style="background-color:${color}; font-size:11px;">${progresRaw || '0'}</span></td>
              <td class="py-2 px-4 text-center text-xs">${tahap||'-'}</td>
              <td class="py-2 px-4 text-center">${fotoBadge}</td>
            </tr>`;

            // Parsing Koordinat Gabungan (Memisahkan Latitude dan Longitude)
            if (koordinatStr.includes(',')) {
              let coords = koordinatStr.split(',').map(c => parseFloat(c.trim().replace(',', '.')));
              let lat = coords[0];
              let lng = coords[1];

              if (!isNaN(lat) && !isNaN(lng)) {
                // Antisipasi jika posisi Lat & Lng terbalik di sheet
                if (Math.abs(lat) > 90) { let t = lat; lat = lng; lng = t; }

                let marker = L.circleMarker([lat, lng], { radius: 6, fillColor: color, color: '#fff', weight: 1.5, fillOpacity: 0.9 });
                marker.bindPopup(`
                  <div style="width:200px; font-family:'Plus Jakarta Sans',sans-serif;">
                    <b style="font-size:14px; color:#093C4F;">${nama||'-'}</b><br>
                    <span style="font-size:11px; color:#64748B;">NOBNBA: ${nobnba||'-'}</span>
                    <hr style="margin:5px 0;">
                    <b>Kab/Kota:</b> ${kab}<br>
                    <b>Desa:</b> ${desa}<br>
                    <b>Progres:</b> <span style="color:${color}; font-weight:bold;">${progresRaw || '0'}</span><br>
                    <b>Tahap:</b> ${tahap||'-'}
                    ${foto ? `<br><a href="${foto}" target="_blank" style="display:inline-block; margin-top:6px; color:#0E5975; font-weight:bold;">🔗 Buka Foto Lokasi</a>` : ''}
                  </div>
                `);
                pointLayerGroup.addLayer(marker);
                bounds.extend([lat, lng]);
              }
            }
          }
        });

        document.getElementById('table-head').innerHTML = `<tr><th class="p-3 text-center">No</th><th class="p-3">NOBNBA</th><th class="p-3">Nama Penerima</th><th class="p-3">Desa</th><th class="p-3 text-center">Progres</th><th class="p-3 text-center">Tahap</th><th class="p-3 text-center">Foto</th></tr>`;
        
        if (bounds.isValid() && kabFilter !== "ALL") map.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
        else if (kabFilter === "ALL") map.setView([-8.65, 121.0], 8);

      } else {
        let dataToRender = allData.bsps_old.filter(r => String(r[4]).trim() === year);
        dataToRender.forEach((row, i) => {
          let kab=row[0], kec=row[1], desa=row[2], unit=parseInt(row[3])||0, foto=row[5];
          if(kab) {
            totalUnits += unit;
            kabCounts[kab] = (kabCounts[kab] || 0) + unit;
            bspsPolygonMap[normalizeName(kab)] = (bspsPolygonMap[normalizeName(kab)] || 0) + unit;
            
            let btnFoto = foto ? `<a href="${foto}" target="_blank" class="text-brand-teal underline"><i class="fa-solid fa-image"></i></a>` : '-';
            tbody += `<tr class="hover:bg-slate-50"><td class="py-2 px-4 text-center">${i+1}</td><td class="py-2 px-4 font-semibold">${kab}</td><td class="py-2 px-4">${kec}</td><td class="py-2 px-4">${desa}</td><td class="py-2 px-4 text-right font-bold">${unit}</td><td class="py-2 px-4 text-center">${btnFoto}</td></tr>`;
          }
        });
        
        map.setView([-8.65, 121.0], 8);
        document.getElementById('table-head').innerHTML = `<tr><th class="p-3 text-center">No</th><th class="p-3">Kabupaten</th><th class="p-3">Kecamatan</th><th class="p-3">Desa</th><th class="p-3 text-right">Jumlah Unit</th><th class="p-3 text-center">Foto</th></tr>`;
      }

      if(geojsonFillLayer) geojsonFillLayer.setStyle(styleFillFeature);

      document.getElementById('stats-container').innerHTML = `
        <div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-brand-gold text-slate-900 flex items-center justify-center text-xl"><i class="fa-solid fa-users"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Total ${currentBspsFormat==='point'?'Penerima':'Unit'} (${year})</p><h3 class="text-2xl font-extrabold text-brand-darkteal">${totalUnits.toLocaleString('id-ID')}</h3></div></div>
        <div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4 md:col-span-2"><div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-map-location-dot"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Cakupan Wilayah</p><h3 class="text-2xl font-extrabold text-emerald-600">${Object.keys(kabCounts).length} Kabupaten/Kota</h3></div></div>
      `;
      document.getElementById('table-body').innerHTML = tbody || '<tr><td colspan="7" class="text-center py-4">Data tidak ditemukan.</td></tr>';
      
      document.getElementById('chart-title').innerText = `Sebaran BSPS (${year})`;
      renderChart(Object.keys(kabCounts), [{ label: currentBspsFormat==='point'?'Penerima BSPS':'Jumlah Unit BSPS', data: Object.values(kabCounts), backgroundColor: '#0E5975', borderRadius: 4 }]);
    }

    function renderRTLH() {
      let l=[], rD=[], bD=[], tR=0, tB=0, vC=0, tbody=''; sheetDataMap={};
      allData.rtlh.forEach((row, i) => { let k=row[0], r=parseInt(row[1])||0, b=parseInt(row[2])||0; if(k){ l.push(k); rD.push(r); bD.push(b); tR+=r; tB+=b; vC++; sheetDataMap[normalizeName(k)]={rtlh:r, backlog:b}; tbody+=`<tr class="hover:bg-slate-50"><td class="py-2 px-4 text-center">${i+1}</td><td class="py-2 px-4">${k}</td><td class="py-2 px-4 text-right">${r.toLocaleString('id-ID')}</td><td class="py-2 px-4 text-right">${b.toLocaleString('id-ID')}</td></tr>`; }});
      document.getElementById('stats-container').innerHTML = `<div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-brand-teal text-white flex items-center justify-center text-xl"><i class="fa-solid fa-house-chimney-crack"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Total RTLH</p><h3 class="text-2xl font-extrabold text-brand-darkteal">${tR.toLocaleString('id-ID')}</h3></div></div><div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-brand-gold text-slate-900 flex items-center justify-center text-xl"><i class="fa-solid fa-house-medical-circle-exclamation"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Total Backlog</p><h3 class="text-2xl font-extrabold text-brand-darkteal">${tB.toLocaleString('id-ID')}</h3></div></div><div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-map-location-dot"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Kabupaten/Kota</p><h3 class="text-2xl font-extrabold text-emerald-600">${vC} Wilayah</h3></div></div>`;
      document.getElementById('table-head').innerHTML = `<tr><th class="p-3 text-center">No</th><th class="p-3">Kabupaten</th><th class="p-3 text-right">RTLH</th><th class="p-3 text-right">Backlog</th></tr>`; document.getElementById('table-body').innerHTML = tbody;
      document.getElementById('chart-title').innerText = "Grafik RTLH & Backlog"; renderChart(l, [{label:'RTLH', data:rD, backgroundColor:'#0E5975'},{label:'Backlog', data:bD, backgroundColor:'#CBA355'}]);
    }
    
    function renderRusun() {
      let t='', kC={}, tR=0;
      allData.rusun.forEach((r, i) => { let k=r[0], n=r[1], c=r[2], l=r[3], ta=r[4], f=r[5]; if(k){ tR++; kC[k]=(kC[k]||0)+1; t+=`<tr class="hover:bg-slate-50"><td class="py-2 px-4 text-center">${i+1}</td><td class="py-2 px-4">${k}</td><td class="py-2 px-4">${n}</td><td class="py-2 px-4">${l}</td><td class="py-2 px-4 text-center">${ta}</td></tr>`; if(c&&c.includes(',')){ let [lat, lng]=c.split(',').map(x=>parseFloat(x.trim())); if(!isNaN(lat)&&!isNaN(lng)){ pointLayerGroup.addLayer(L.marker([lat, lng]).bindPopup(`<b>${n}</b><br>${l}`)); } } }});
      document.getElementById('stats-container').innerHTML = `<div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-brand-teal text-white flex items-center justify-center text-xl"><i class="fa-solid fa-building"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Total Rusun</p><h3 class="text-2xl font-extrabold text-brand-darkteal">${tR} Unit</h3></div></div><div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4 md:col-span-2"><div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-map-location-dot"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Tersebar di</p><h3 class="text-2xl font-extrabold text-emerald-600">${Object.keys(kC).length} Kabupaten</h3></div></div>`;
      document.getElementById('table-head').innerHTML = `<tr><th class="p-3 text-center">No</th><th class="p-3">Kabupaten</th><th class="p-3">Nama Rusun</th><th class="p-3">Lokasi</th><th class="p-3">TA</th></tr>`; document.getElementById('table-body').innerHTML = t;
      document.getElementById('chart-title').innerText = "Sebaran Rusun"; renderChart(Object.keys(kC), [{label:'Rusun', data:Object.values(kC), backgroundColor:'#0E5975'}]);
    }

    function renderRusus() {
      let t='', tR=0, kC={};
      allData.rusus.forEach((r, i) => { let n=r[0], l=r[1], k=r[2], u=parseInt(r[3])||0, ta=r[4]; if(k){ tR+=u; kC[k]=(kC[k]||0)+u; t+=`<tr class="hover:bg-slate-50"><td class="py-2 px-4 text-center">${i+1}</td><td class="py-2 px-4">${n}</td><td class="py-2 px-4">${k}</td><td class="py-2 px-4 text-right">${u}</td><td class="py-2 px-4 text-center">${ta}</td></tr>`; }});
      document.getElementById('stats-container').innerHTML = `<div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-brand-teal text-white flex items-center justify-center text-xl"><i class="fa-solid fa-house-flag"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Total Rusus</p><h3 class="text-2xl font-extrabold text-brand-darkteal">${tR} Unit</h3></div></div><div class="bg-white rounded-2xl shadow p-5 flex items-center gap-4 md:col-span-2"><div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl"><i class="fa-solid fa-map-location-dot"></i></div><div><p class="text-xs text-slate-500 font-bold uppercase">Tersebar di</p><h3 class="text-2xl font-extrabold text-emerald-600">${Object.keys(kC).length} Kabupaten</h3></div></div>`;
      document.getElementById('table-head').innerHTML = `<tr><th class="p-3 text-center">No</th><th class="p-3">Nama Rusus</th><th class="p-3">Kabupaten</th><th class="p-3 text-right">Unit</th><th class="p-3">TA</th></tr>`; document.getElementById('table-body').innerHTML = t;
      document.getElementById('chart-title').innerText = "Sebaran Rusus"; renderChart(Object.keys(kC), [{label:'Rusus', data:Object.values(kC), backgroundColor:'#0E5975'}]);
    }

    function renderChart(labels, datasets) {
      if (myChart) myChart.destroy();
      myChart = new Chart(document.getElementById('barChart').getContext('2d'), { type: 'bar', data: { labels: labels, datasets: datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true, grid: { drawBorder: false } }, x: { grid: { display: false } } } } });
    }
  </script>
</body>
</html>
